<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AAN — Admin Orders</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f8f4ec;color:#18130f}
main{max-width:1200px;margin:auto;padding:30px 16px}.card{background:#fff;border:1px solid #e5dccf;padding:22px;margin-bottom:18px}
h1{font-family:Georgia,serif}input,button{padding:12px;font:inherit}button{cursor:pointer}
.row{display:flex;gap:10px;flex-wrap:wrap}.row input{flex:1;min-width:220px}
.status{margin-top:12px;font-size:13px}.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:1050px}th,td{padding:10px;border-bottom:1px solid #e5dccf;text-align:left;font-size:12px;vertical-align:top}
.admin-btn{background:#18130f;color:#fff;border:0}
</style>
</head>
<body>
<main>
  <h1>AAN Admin Orders</h1>
  <div class="card">
    <div class="row">
      <input id="password" type="password" placeholder="Admin password">
      <button class="admin-btn" onclick="loadOrders()">View All Orders</button>
    </div>
    <div class="status" id="status">Enter the admin password and click View All Orders.</div>
  </div>

  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Order ID</th><th>Date</th><th>Status</th><th>Product</th><th>Size</th>
          <th>Qty</th><th>Total</th><th>Name</th><th>Phone</th><th>Email</th><th>Address</th>
        </tr></thead>
        <tbody id="ordersBody"></tbody>
      </table>
    </div>
  </div>
</main>

<script>
const AAN_ORDERS_ENDPOINT = '';
const AAN_ADMIN_PASSWORD = 'AAN@2026';

function esc(v){
  return String(v ?? '').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[c]));
}

function loadOrders(){
  const pass=document.getElementById('password').value;
  const status=document.getElementById('status');

  if(!pass){status.textContent='Please enter the admin password.';return;}
  if(pass!==AAN_ADMIN_PASSWORD){status.textContent='Incorrect admin password.';return;}
  if(!AAN_ORDERS_ENDPOINT){
    status.textContent='Google Apps Script /exec URL is not configured in admin.html.';
    return;
  }

  status.textContent='Loading orders…';
  const cb='aanAdmin_'+Date.now();

  window[cb]=function(result){
    try{
      if(result && result.error){
        status.textContent='Backend rejected the request.';
        return;
      }

      const rows=Array.isArray(result)?result:[];
      document.getElementById('ordersBody').innerHTML=rows.map(o=>`
        <tr>
          <td>${esc(o.orderId)}</td>
          <td>${esc(o.date)}</td>
          <td>${esc(o.status)}</td>
          <td>${esc(o.productName)}</td>
          <td>${esc(o.size)}</td>
          <td>${esc(o.quantity)}</td>
          <td>₹${Number(o.total||0).toLocaleString('en-IN')}</td>
          <td>${esc(o.name)}</td>
          <td>${esc(o.phone)}</td>
          <td>${esc(o.email)}</td>
          <td>${esc(o.address)}</td>
        </tr>`).join('');

      status.textContent=rows.length+' order(s) found.';
    }finally{
      delete window[cb];
      if(script) script.remove();
    }
  };

  const script=document.createElement('script');
  script.src=AAN_ORDERS_ENDPOINT+
    '?action=adminHistory&password='+encodeURIComponent(pass)+
    '&callback='+encodeURIComponent(cb);
  script.onerror=()=>{
    status.textContent='Unable to fetch orders. Check the /exec URL and Apps Script deployment.';
    delete window[cb];
    script.remove();
  };
  document.body.appendChild(script);
}
</script>
</body>
</html>
